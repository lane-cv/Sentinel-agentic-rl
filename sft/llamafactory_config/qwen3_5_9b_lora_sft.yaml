model_name_or_path: /root/autodl-tmp/models/qwen3.5-9b-text-only
trust_remote_code: true

stage: sft
do_train: true
finetuning_type: lora

lora_rank: 16
lora_alpha: 32
lora_dropout: 0.05
lora_target: q_proj,k_proj,v_proj,o_proj,gate_proj,up_proj,down_proj,in_proj_qkv,in_proj_z,in_proj_b,in_proj_a,out_proj

dataset: aiops_cold_start_prefix_split
template: qwen3_5_nothink
cutoff_len: 8192
preprocessing_num_workers: 16
dataloader_num_workers: 4

output_dir: saves/aiops-diagnose-qwen3.5-9b/lora/sft
logging_steps: 10
save_steps: 100
plot_loss: true
overwrite_output_dir: false
save_only_model: false
report_to: none

per_device_train_batch_size: 1
gradient_accumulation_steps: 8
learning_rate: 1.0e-4
num_train_epochs: 3.0
lr_scheduler_type: cosine
warmup_ratio: 0.1
bf16: true
disable_gradient_checkpointing: false
flash_attn: sdpa
ddp_timeout: 180000000
resume_from_checkpoint: null
